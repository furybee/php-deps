<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP Deps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading graph...</div>
  </div>

  <!-- Graph container -->
  <div id="sigma-container"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Dependency Graph</h1>
      <div class="stats" id="stats-text"></div>
    </div>

    <div id="search-container">
      <input type="text" id="search-input" placeholder="Search classes..." autocomplete="off">
      <div id="search-results"></div>
    </div>

    <div id="view-mode">
      <label>View</label>
      <div class="view-buttons">
        <button class="view-btn active" data-mode="namespaces">Namespaces</button>
        <button class="view-btn" data-mode="classes">Classes</button>
        <button class="view-btn" data-mode="full">Full Graph</button>
      </div>
    </div>

    <div id="size-mode">
      <label for="size-by">Node size</label>
      <select id="size-by">
        <option value="methods">Methods</option>
        <option value="dependents">Dependents (Ca)</option>
      </select>
    </div>

    <div id="cycles-section" hidden>
      <div class="filter-header">
        <label>Cycles</label>
        <button id="cycle-clear" class="toggle-all-btn" hidden>Show all</button>
      </div>
      <div id="cycle-list"></div>
    </div>

    <div id="filters">
      <div class="filter-header">
        <label>Layers</label>
        <button id="layer-toggle-all" class="toggle-all-btn">Deselect all</button>
      </div>
      <div id="layer-filters"></div>
    </div>

    <div id="class-type-filters-section">
      <div class="filter-header">
        <label>Types</label>
        <button id="class-type-toggle-all" class="toggle-all-btn">Deselect all</button>
      </div>
      <div id="class-type-filters"></div>
    </div>

    <div id="edge-filters">
      <div class="filter-header">
        <label>Edge Types</label>
        <button id="edge-toggle-all" class="toggle-all-btn">Deselect all</button>
      </div>
      <div id="edge-type-filters"></div>
    </div>

    <details id="settings">
      <summary>Editor links</summary>
      <label for="editor-url">URL template, <code>{file}</code> and <code>{line}</code> are replaced</label>
      <input type="text" id="editor-url" autocomplete="off" spellcheck="false">
      <label for="project-path">Project path on this machine</label>
      <input type="text" id="project-path" autocomplete="off" spellcheck="false">
    </details>
  </div>

  <button id="sidebar-toggle">&#9776;</button>

  <!-- Breadcrumb for namespace navigation -->
  <div id="breadcrumb"></div>

  <!-- Tooltip -->
  <div id="tooltip">
    <div class="tooltip-title"></div>
    <div class="tooltip-namespace"></div>
    <div class="tooltip-layer"></div>
    <div class="tooltip-methods"></div>
  </div>

  <!-- Info panel -->
  <div id="info-panel">
    <div class="panel-header">
      <span class="panel-title"></span>
      <button class="panel-close">&times;</button>
    </div>
    <div class="panel-body"></div>
  </div>

  <!-- Layout controls -->
  <div id="layout-controls">
    <button id="btn-layout" title="Start/stop force layout">Force Layout</button>
    <button id="btn-reset-zoom" title="Reset zoom">Reset Zoom</button>
  </div>

  <script src="vendor/graphology.umd.min.js"></script>
  <script src="vendor/graphology-layout-forceatlas2.min.js"></script>
  <script src="vendor/sigma.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
